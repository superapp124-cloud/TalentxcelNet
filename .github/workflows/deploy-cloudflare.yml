name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm run build:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://talentxcel.net
          NEXT_PUBLIC_ACADEMY_URL: https://academy.talentxcel.net
          NEXT_PUBLIC_AI_URL: https://ai.talentxcel.net
          NEXT_PUBLIC_APP_NAME: TalentXcel Academy
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_FEATURE_AI_TUTOR: ${{ secrets.NEXT_PUBLIC_FEATURE_AI_TUTOR }}
          NEXT_PUBLIC_FEATURE_PAYMENTS: ${{ secrets.NEXT_PUBLIC_FEATURE_PAYMENTS }}
          NEXT_PUBLIC_FEATURE_OFFLINE: ${{ secrets.NEXT_PUBLIC_FEATURE_OFFLINE }}
          NEXT_PUBLIC_FEATURE_ADMISSIONS: ${{ secrets.NEXT_PUBLIC_FEATURE_ADMISSIONS }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
