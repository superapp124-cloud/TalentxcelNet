name: Production Health & Free-Tier Observability

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours at zero cost via GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Edge Cache, Googlebot & Free Quota Monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run zero-cost observability probe
        run: node scripts/cf-free-observability.mjs --base-url=https://talentxcel.net
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
